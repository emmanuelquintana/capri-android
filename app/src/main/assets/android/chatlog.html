<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Historial</title>
  <!-- Your chat history with her (1.10.0, PageActivity "chatlog"): what you said and what she
       answered, by day, newest at the bottom. Kept on this phone only (ChatLog.kt). -->
  <link rel="stylesheet" href="../capri/src/renderer/styles/capri.css">
  <style>
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--paper); }
    body {
      font-family: var(--font-display);
      background-image: repeating-linear-gradient(0deg, rgba(242, 241, 232, 0.04) 0 1px, transparent 1px 4px);
      padding: 0 16px 96px;
      box-sizing: border-box;
    }
    header {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: center; gap: 12px;
      padding: 18px 0 12px;
      background: linear-gradient(var(--ink) 80%, transparent);
    }
    header img { width: 44px; height: 44px; image-rendering: auto; filter: brightness(1.3) saturate(1.2); }
    header h1 { margin: 0; font-size: 20px; letter-spacing: 0.04em; }
    header p { margin: 2px 0 0; font: 500 11px/1.2 var(--font-mono); color: var(--yellow); letter-spacing: 0.14em; text-transform: uppercase; }
    .search {
      width: 100%; box-sizing: border-box; margin: 4px 0 8px;
      padding: 10px 12px; border: 1px solid rgba(242, 241, 232, 0.25); background: rgba(242, 241, 232, 0.04);
      color: var(--paper); font: 15px var(--font-body, sans-serif); outline: none; border-radius: 0;
    }
    .search:focus { border-color: var(--yellow); }
    .day { margin: 22px 0 8px; font: 600 11px/1 var(--font-mono); letter-spacing: 0.18em; color: var(--paper-3, #8f8e85); text-transform: uppercase; }
    .turn { margin: 10px 0 16px; }
    .you, .her { padding: 10px 12px; font: 15px/1.4 var(--font-body, sans-serif); white-space: pre-wrap; word-wrap: break-word; }
    .you { margin-left: 18%; background: rgba(246, 236, 0, 0.1); border-right: 2px solid var(--yellow); }
    .her { margin-right: 10%; margin-top: 6px; background: rgba(54, 255, 122, 0.07); border-left: 2px solid #36ff7a; }
    .when { display: block; margin-top: 4px; font: 500 10px/1 var(--font-mono); color: var(--paper-3, #8f8e85); letter-spacing: 0.1em; }
    .you .when { text-align: right; }
    .empty { margin-top: 30vh; text-align: center; color: var(--paper-2, #cfcec5); font: 15px/1.5 var(--font-body, sans-serif); }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 12px 16px 18px;
      background: linear-gradient(transparent, var(--ink) 30%);
    }
    .bar button {
      flex: 1; padding: 13px 10px; border: 1px solid rgba(242, 241, 232, 0.35); background: var(--ink);
      color: var(--paper); font: 600 13px/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase;
    }
    .bar button.red { border-color: #ff2052; color: #ff2052; }
    mark { background: var(--yellow); color: var(--ink); }
  </style>
</head>
<body>
  <header>
    <img src="../capri/assets/capri/face-look.png" alt="">
    <div><h1 id="title"></h1><p id="count"></p></div>
  </header>
  <input class="search" id="search" type="search" autocomplete="off">
  <main id="list"></main>
  <div class="bar"><button id="down"></button><button id="clear" class="red"></button></div>
  <script>
    const T = {
      es: { title: 'Historial de chat', count: '{n} mensajes', none: 'Todavía no han hablado. Lo que le digas en su chat y lo que te responda aparecerá aquí.', search: 'Buscar en el historial…', down: 'Lo último', clear: 'Borrar todo', sure: '¿Borrar todo el historial? No se puede deshacer.', today: 'Hoy', yesterday: 'Ayer', you: 'Tú', nothing: 'Nada con «{q}».' },
      en: { title: 'Chat history', count: '{n} messages', none: 'You haven’t talked yet. What you tell her in her chat and what she answers will show up here.', search: 'Search the history…', down: 'Latest', clear: 'Delete all', sure: 'Delete the whole history? This can’t be undone.', today: 'Today', yesterday: 'Yesterday', you: 'You', nothing: 'Nothing with “{q}”.' },
      fr: { title: 'Historique du chat', count: '{n} messages', none: 'Vous n’avez pas encore parlé. Ce que tu lui dis dans son chat et ce qu’elle répond apparaîtra ici.', search: 'Chercher dans l’historique…', down: 'Le plus récent', clear: 'Tout effacer', sure: 'Effacer tout l’historique ? C’est définitif.', today: 'Aujourd’hui', yesterday: 'Hier', you: 'Toi', nothing: 'Rien avec « {q} ».' },
      pt: { title: 'Histórico do chat', count: '{n} mensagens', none: 'Vocês ainda não conversaram. O que você disser no chat dela e o que ela responder vai aparecer aqui.', search: 'Buscar no histórico…', down: 'Mais recente', clear: 'Apagar tudo', sure: 'Apagar todo o histórico? Não dá para desfazer.', today: 'Hoje', yesterday: 'Ontem', you: 'Você', nothing: 'Nada com “{q}”.' },
      ru: { title: 'История чата', count: 'Сообщений: {n}', none: 'Вы ещё не разговаривали. Здесь появится то, что ты пишешь ей в чате, и её ответы.', search: 'Поиск по истории…', down: 'Последние', clear: 'Удалить всё', sure: 'Удалить всю историю? Это нельзя отменить.', today: 'Сегодня', yesterday: 'Вчера', you: 'Ты', nothing: 'Ничего по «{q}».' },
    };
    const bridge = window.CapriPage;
    const info = JSON.parse(bridge?.info?.() || '{}');
    const lang = T[info.lang] ? info.lang : 'es';
    const t = T[lang];
    const locale = { es: 'es-MX', en: 'en-US', fr: 'fr-FR', pt: 'pt-BR', ru: 'ru-RU' }[lang];
    document.documentElement.lang = lang;
    let all = [];
    try { all = JSON.parse(bridge?.chatlog?.() || '[]'); } catch {}
    const $ = (id) => document.getElementById(id);
    $('title').textContent = t.title;
    $('search').placeholder = t.search;
    $('down').textContent = t.down;
    $('clear').textContent = t.clear;

    const dayOf = (at) => {
      const d = new Date(at);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const that = new Date(d); that.setHours(0, 0, 0, 0);
      const diff = Math.round((today - that) / 86400000);
      if (diff === 0) return t.today;
      if (diff === 1) return t.yesterday;
      return d.toLocaleDateString(locale, { weekday: 'long', day: 'numeric', month: 'long', year: that.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
    };
    const time = (at) => new Date(at).toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const mark = (s, q) => {
      const safe = esc(s);
      if (!q) return safe;
      const re = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      return safe.replace(re, (m) => `<mark>${m}</mark>`);
    };

    function render() {
      const q = $('search').value.trim();
      const lower = q.toLowerCase();
      const list = q ? all.filter((m) => `${m.q}\n${m.a}`.toLowerCase().includes(lower)) : all;
      $('count').textContent = t.count.replace('{n}', all.length);
      const out = $('list');
      out.innerHTML = '';
      if (!all.length) { out.innerHTML = `<p class="empty">${esc(t.none)}</p>`; $('clear').hidden = true; return; }
      if (!list.length) { out.innerHTML = `<p class="empty">${esc(t.nothing.replace('{q}', q))}</p>`; return; }
      let day = '';
      const html = [];
      for (const m of list) {
        const d = dayOf(m.at);
        if (d !== day) { day = d; html.push(`<div class="day">${esc(d)}</div>`); }
        html.push(`<div class="turn">${m.q ? `<div class="you">${mark(m.q, q)}<span class="when">${esc(t.you)} · ${time(m.at)}</span></div>` : ''}<div class="her">${mark(m.a, q)}<span class="when">Capri · ${time(m.at)}</span></div></div>`);
      }
      out.innerHTML = html.join('');
    }
    render();
    scrollTo(0, document.body.scrollHeight);
    $('search').addEventListener('input', render);
    $('down').addEventListener('click', () => scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
    $('clear').addEventListener('click', () => {
      if (!confirm(t.sure)) return;
      bridge?.clearChatlog?.();
      all = [];
      render();
    });
  </script>
</body>
</html>
