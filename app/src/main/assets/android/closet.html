<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Vestuario</title>
  <!-- The app's own Vestuario screen (ClosetActivity): her wardrobe sheet (wardrobe.js), with her on a
       stage above it instead of over your screen. What you pick is saved as she'd save it. -->
  <link rel="stylesheet" href="../capri/src/renderer/styles/capri.css">
  <link rel="stylesheet" href="android.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      pointer-events: auto;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: var(--font-display);
      /* the faint scanlines of her HUD (Hud.Backdrop) */
      background-image: repeating-linear-gradient(0deg, rgba(242, 241, 232, 0.04) 0 1px, transparent 1px 4px);
    }
    .stage {
      position: relative;
      flex: 0 0 auto;
      height: clamp(240px, 42vh, 460px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      padding-top: 34px;
      box-sizing: border-box;
    }
    /* her floor: a yellow line with the cyan copy just off it */
    .stage::after {
      content: '';
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 10px;
      height: 2px;
      background: var(--yellow);
      box-shadow: 3px 3px 0 var(--cyan);
    }
    .stage__tag {
      position: absolute;
      top: 14px;
      left: 16px;
      font: 600 11px/1 var(--font-mono);
      letter-spacing: 0.18em;
      color: var(--yellow);
    }
    .stage__tag b { color: var(--paper-3); font-weight: 600; }
    /* as bright as her shader shows her on your screen */
    .stage__her {
      height: calc(100% - 22px);
      margin-bottom: 11px;
      filter: brightness(1.3) saturate(1.2);
      animation: closet-breathe 3.6s ease-in-out infinite;
      transform-origin: 50% 100%;
    }
    #sprite { height: 100%; width: auto; display: block; transition: opacity 160ms; }
    .stage__her.is-new { animation: closet-glitch 220ms steps(3, end) 1, closet-breathe 3.6s ease-in-out 220ms infinite; }
    @keyframes closet-breathe { 50% { transform: scaleY(1.012); } }
    @keyframes closet-glitch {
      0% { transform: translateX(-6px); clip-path: inset(0 0 55% 0); }
      50% { transform: translateX(5px); clip-path: inset(40% 0 0 0); }
      100% { transform: none; clip-path: none; }
    }
    @media (prefers-reduced-motion: reduce) { .stage__her, .stage__her.is-new { animation: none; } }

    /* her sheet, in the page instead of over your screen */
    .wardrobe {
      position: relative;
      left: auto;
      bottom: auto;
      transform: none;
      flex: 1 1 auto;
      min-height: 0;
      height: auto;
      width: auto;
      margin: 0 12px;
      animation: none;
    }
    .wardrobe-shade, .wardrobe__done { display: none !important; }
    .bar {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    }
    .bar button {
      flex: 1;
      min-height: 48px;
      border: 2px solid var(--yellow);
      background: transparent;
      color: var(--yellow);
      font: 700 13px/1.1 var(--font-display);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    }
    .bar button.is-main { background: var(--yellow); color: var(--ink); }
    .bar button:active { background: var(--cyan); border-color: var(--cyan); color: var(--ink); }

    /* (1.13.0) the community store (store.js) */
    .bar--store { padding-bottom: 0; }
    .bar--store button { border-color: var(--cyan); color: var(--cyan); }
    .store {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      background: var(--ink);
      background-image: repeating-linear-gradient(0deg, rgba(242, 241, 232, 0.04) 0 1px, transparent 1px 4px);
      padding: 0 12px calc(8px + env(safe-area-inset-bottom));
    }
    .store[hidden] { display: none; }
    .store__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 2px 4px; }
    .store__title { font: 700 15px/1.1 var(--font-display); color: var(--yellow); letter-spacing: 0.08em; text-transform: uppercase; }
    .store__close, .store__btn {
      min-height: 44px;
      padding: 0 14px;
      border: 2px solid var(--yellow);
      background: transparent;
      color: var(--yellow);
      font: 700 12px/1 var(--font-display);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
      transition: transform 120ms ease-out;
    }
    .store__btn:active, .store__close:active, .store__chip:active, .store__heart:active { transform: scale(0.96); }
    .store__btn.is-main { background: var(--yellow); color: var(--ink); }
    .store__btn:disabled { opacity: 0.65; }
    .store__note { margin: 4px 2px 10px; color: var(--paper-3); font: 400 12px/1.35 var(--font-mono); }
    .store__sort { display: flex; padding: 3px; gap: 3px; border: 1px solid var(--line, #3a3646); background: var(--ink-2, #15121c); }
    .store__sort button {
      flex: 1;
      min-height: 40px;
      border: 0;
      background: transparent;
      color: var(--paper-2, #cfcbd8);
      font: 600 13px/1 var(--font-display);
      transition: background 160ms ease-out, color 160ms ease-out;
    }
    .store__sort button.is-on { background: var(--cyan); color: var(--ink); }
    .store__cats { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px; scrollbar-width: none; flex: 0 0 auto; }
    .store__cats::-webkit-scrollbar { display: none; }
    .store__cats[hidden] { display: none; }
    .store__chip {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--line, #3a3646);
      border-radius: 999px;
      background: transparent;
      color: var(--paper-2, #cfcbd8);
      font: 600 12.5px/1 var(--font-display);
      white-space: nowrap;
    }
    .store__chip.is-on { border-color: var(--yellow); background: var(--yellow); color: var(--ink); }
    .store__list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      align-content: start;
      padding-bottom: 12px;
    }
    .store__msg { grid-column: 1 / -1; margin: 40px 10px; text-align: center; color: var(--paper-3); font: 400 13px/1.5 var(--font-mono); }
    .store__msg .store__btn { margin-top: 12px; }
    .store__card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      border: 1px solid var(--line, #3a3646);
      background: var(--ink-2, #15121c);
      min-width: 0;
    }
    .store__card.is-mine { border-color: var(--green, #08f467); }
    .store__frame { position: relative; aspect-ratio: 240 / 330; overflow: hidden;
      background: radial-gradient(circle at 50% 70%, rgba(0, 229, 255, 0.14), transparent 70%); }
    .store__pic { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; filter: brightness(1.3) saturate(1.2); }
    .store__tag { position: absolute; top: 6px; right: 6px; padding: 3px 7px; background: var(--green, #08f467); color: var(--ink); font: 700 10.5px/1 var(--font-mono); }
    .store__name { margin: 0; font: 700 14px/1.2 var(--font-display); color: var(--paper); overflow-wrap: anywhere; }
    .store__name.is-big { font-size: 20px; }
    .store__by { margin: 0; color: var(--paper-3); font: 400 11.5px/1.3 var(--font-mono); overflow-wrap: anywhere; }
    .store__foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .store__how { align-self: flex-start; padding: 3px 6px; font: 600 10.5px/1.1 var(--font-mono); border: 1px solid currentColor; }
    .store__how.is-ia { color: var(--cyan); }
    .store__how.is-mano { color: var(--yellow); }
    .store__how.is-cat { color: var(--paper-2, #cfcbd8); }
    .store__tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .store__desc { margin: 0; color: var(--paper-2, #cfcbd8); font: 400 13px/1.4 var(--font-display); }
    .store__fail { margin: 0; color: #ff5470; font: 600 11.5px/1.2 var(--font-mono); }
    .store__actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .store__card .store__actions .store__btn { flex: 1 1 auto; min-height: 40px; padding: 0 8px; font-size: 11px; }
    .store__heart {
      min-height: 36px;
      min-width: 56px;
      padding: 0 10px;
      border: 1px solid #ff5fa2;
      background: transparent;
      color: #ff5fa2;
      font: 700 13px/1 var(--font-display);
    }
    .store__heart.is-big { min-height: 44px; min-width: 72px; font-size: 15px; }
    .store__heart.is-on { background: #ff5fa2; color: var(--ink); }
    .store__heart.is-off { opacity: 0.5; }
    .store__heart.is-pop { animation: store-pop 320ms cubic-bezier(0.2, 0.9, 0.3, 1.4); }
    @keyframes store-pop { 40% { transform: scale(1.18); } }
    /* a skin, big (tap its card) */
    .store__sheet { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; justify-content: flex-end; }
    .store__sheet[hidden] { display: none; }
    .store__shade { position: absolute; inset: 0; background: rgba(5, 4, 8, 0.72); }
    .store__detail {
      position: relative;
      max-height: 92vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
      background: var(--ink);
      border-top: 2px solid var(--yellow);
      animation: store-up 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes store-up { from { transform: translateY(24px); opacity: 0; } }
    .store__back { align-self: flex-start; border-width: 1px; min-height: 36px; }
    .store__big { align-self: center; height: min(46vh, 420px); width: auto; filter: brightness(1.3) saturate(1.2);
      background: radial-gradient(circle at 50% 70%, rgba(0, 229, 255, 0.14), transparent 70%); }
    .store__info { display: flex; flex-direction: column; gap: 8px; }
    .store__info .store__actions { margin-top: 4px; }
    .store__info .store__actions .store__btn.is-main { flex: 1 1 auto; }
    .store__toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 70;
      margin: 0;
      padding: 12px 14px;
      background: var(--paper);
      color: var(--ink);
      font: 600 13px/1.35 var(--font-display);
      text-align: center;
      animation: store-up 200ms ease-out;
    }
    .store__toast[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { .store__detail, .store__toast, .store__heart.is-pop { animation: none; } }
  </style>
</head>
<body>
  <div class="stage">
    <span class="stage__tag">// CAPRI <b>· LIVE</b></span>
    <div class="stage__her"><canvas id="sprite" width="240" height="420"></canvas></div>
  </div>
  <div class="bar">
    <button type="button" id="on-screen"></button>
    <button type="button" id="done" class="is-main"></button>
  </div>
  <script type="module" src="closet.js"></script>
</body>
</html>
