<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Juegos</title>
  <!-- Games with her (1.10.0, PageActivity "games", games.js) -->
  <link rel="stylesheet" href="../capri/src/renderer/styles/capri.css">
  <style>
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--paper); -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-display);
      background-image: repeating-linear-gradient(0deg, rgba(242, 241, 232, 0.04) 0 1px, transparent 1px 4px);
      padding: 14px 16px 28px; box-sizing: border-box; user-select: none;
    }
    button { font: inherit; color: inherit; }
    .her { display: flex; align-items: center; gap: 12px; min-height: 76px; }
    .her img { width: 68px; height: 68px; flex: 0 0 auto; filter: brightness(1.3) saturate(1.2); }
    .her img.is-new { animation: glitch 220ms steps(3, end) 1; }
    @keyframes glitch { 0% { transform: translateX(-5px); clip-path: inset(0 0 55% 0); } 50% { transform: translateX(4px); clip-path: inset(40% 0 0 0); } 100% { transform: none; clip-path: none; } }
    .her div { flex: 1; min-width: 0; }
    .her h1 { margin: 0 0 4px; font-size: 13px; font-family: var(--font-mono); letter-spacing: 0.18em; color: var(--yellow); text-transform: uppercase; }
    .her p { margin: 0; font: 16px/1.35 var(--font-body, sans-serif); min-height: 2.7em; padding: 8px 10px; background: rgba(242, 241, 232, 0.05); border-left: 2px solid #36ff7a; }
    .tag { margin: 18px 0 8px; font: 600 11px/1 var(--font-mono); letter-spacing: 0.18em; color: var(--paper-3, #8f8e85); text-transform: uppercase; }
    .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .game { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; text-align: left; background: rgba(31, 30, 23, 0.9); border: 1px solid rgba(242, 241, 232, 0.25); box-shadow: 3px 3px 0 rgba(0, 240, 255, 0.35); }
    .game:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0, 240, 255, 0.35); }
    .game__icon { font-size: 30px; line-height: 1; color: var(--yellow); }
    .game__name { font-size: 17px; letter-spacing: 0.03em; }
    .game__how { font: 12px/1.3 var(--font-body, sans-serif); color: var(--paper-2, #cfcec5); }
    .levels { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
    .levels .tag { width: 100%; margin-bottom: 0; }
    .pill { padding: 9px 14px; border: 1px solid rgba(242, 241, 232, 0.35); background: transparent; font: 600 12px/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; }
    .pill.is-on { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }
    .pill--big { flex: 1; padding: 14px; font-size: 14px; }
    .pill:disabled { opacity: 0.35; }
    .bar { display: flex; justify-content: space-between; margin: 10px 0 12px; }
    .box { display: flex; flex-direction: column; align-items: stretch; }
    /* tic-tac-toe */
    .ttt { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6px; width: min(100%, 360px); margin: 10px auto; aspect-ratio: 1; }
    .ttt__cell { background: rgba(31, 30, 23, 0.9); border: 1px solid rgba(242, 241, 232, 0.2); font-size: 56px; line-height: 1; }
    .ttt__cell.is-x { color: var(--yellow); }
    .ttt__cell.is-o { color: #36ff7a; text-shadow: 0 0 10px rgba(54, 255, 122, 0.5); }
    /* minesweeper */
    .mines__info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font: 600 14px var(--font-mono); }
    .mines { display: grid; gap: 3px; width: min(100%, 420px); margin: 0 auto; }
    .mines__cell { aspect-ratio: 1; padding: 0; background: rgba(242, 241, 232, 0.13); border: 1px solid rgba(242, 241, 232, 0.2); font: 700 16px var(--font-mono); }
    .mines__cell.is-open { background: rgba(31, 30, 23, 0.9); border-color: rgba(242, 241, 232, 0.08); }
    .mines__cell.is-flag { color: #ff2052; }
    .mines__cell.is-boom { background: #ff2052; color: var(--ink); }
    .mines__cell[data-n="1"] { color: #00f0ff; } .mines__cell[data-n="2"] { color: #36ff7a; } .mines__cell[data-n="3"] { color: var(--yellow); }
    .mines__cell[data-n="4"] { color: #ff9a2e; } .mines__cell[data-n="5"], .mines__cell[data-n="6"], .mines__cell[data-n="7"], .mines__cell[data-n="8"] { color: #ff2052; }
    /* 21 */
    .cards__row { display: flex; flex-wrap: wrap; gap: 8px; min-height: 104px; }
    .card { width: 66px; height: 96px; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 8px; box-sizing: border-box; background: var(--paper); color: var(--ink); border-radius: 4px; animation: deal 260ms ease-out; }
    .card b { font: 700 18px var(--font-mono); } .card i { align-self: flex-end; font-style: normal; font-size: 30px; line-height: 1; }
    .card.is-red { color: #e0103f; }
    .card.is-back { background: repeating-linear-gradient(45deg, #ff2052 0 6px, #13120d 6px 12px); border: 2px solid var(--yellow); }
    @keyframes deal { from { transform: translateY(-14px) rotate(-6deg); opacity: 0; } }
    .cards__acts { display: flex; gap: 10px; margin-top: 22px; }
    /* chess */
    .chess { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: min(100%, 460px); aspect-ratio: 1; margin: 6px auto 0; border: 2px solid rgba(242, 241, 232, 0.3); }
    .chess__sq { padding: 0; border: 0; background: #d8d4bf; font-size: min(9vw, 40px); line-height: 1; position: relative; }
    .chess__sq.is-dark { background: #4d4a3a; }
    .chess__sq.is-w { color: #fffef4; text-shadow: 0 0 1px #000, 0 1px 2px #000, 0 0 3px #000; }
    .chess__sq.is-b { color: #ff2052; text-shadow: 0 0 1px #000, 0 0 6px rgba(255, 32, 82, 0.6); }
    .chess__sq.is-last { box-shadow: inset 0 0 0 3px rgba(0, 240, 255, 0.55); }
    .chess__sq.is-chosen { box-shadow: inset 0 0 0 3px var(--yellow); }
    .chess__sq.is-target::after { content: ''; position: absolute; inset: 36%; border-radius: 50%; background: rgba(54, 255, 122, 0.7); }
    .chess__sq.is-check { background: #ff2052 !important; }
    .chess__caps { text-align: center; font-size: 18px; letter-spacing: 0.05em; min-height: 20px; }
    @media (prefers-reduced-motion: reduce) { .card, .her img.is-new { animation: none; } }
  </style>
</head>
<body>
  <section class="her"><img id="face" src="../capri/assets/capri/capri-face.png" alt=""><div><h1 id="title">Juegos</h1><p id="line"></p></div></section>
  <main id="stage"></main>
  <script type="module" src="games.js"></script>
</body>
</html>
