<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Juegos</title>
  <!-- Games with her (1.10.0, PageActivity "games", games.js) -->
  <link rel="stylesheet" href="../capri/src/renderer/styles/capri.css">
  <style>
    /* (1.10.0, community: "los minijuegos deben tener señales de Capri y ser totalmente estética cyberpunk")
       Night City arcade: her neon (mask green, mane red, cyan echo, yellow), cut corners, scanlines,
       a grid floor, glitches; and her, watching from the corner */
    :root { --g-green: #36ff7a; --g-red: #ff2052; --g-cyan: #00f0ff; --g-panel: rgba(17, 16, 22, 0.92); --cut-s: 10px; }
    html, body { margin: 0; min-height: 100%; background: #07060a; color: var(--paper); -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-display);
      background:
        repeating-linear-gradient(0deg, rgba(242, 241, 232, 0.035) 0 1px, transparent 1px 3px),
        radial-gradient(120% 60% at 50% 0%, rgba(255, 32, 82, 0.16), transparent 60%),
        radial-gradient(90% 50% at 100% 100%, rgba(0, 240, 255, 0.12), transparent 60%),
        #07060a;
      padding: 14px 16px 150px; box-sizing: border-box; user-select: none; position: relative; overflow-x: hidden;
    }
    /* the grid floor, far away */
    body::before {
      content: ''; position: fixed; left: -50%; right: -50%; bottom: 0; height: 42vh; z-index: -1; pointer-events: none;
      background:
        linear-gradient(rgba(255, 32, 82, 0.35) 1px, transparent 1px) 0 0 / 100% 34px,
        linear-gradient(90deg, rgba(0, 240, 255, 0.28) 1px, transparent 1px) 0 0 / 34px 100%;
      transform: perspective(260px) rotateX(62deg); transform-origin: bottom;
      mask-image: linear-gradient(to top, #000 10%, transparent 90%); -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%);
      animation: floor 3s linear infinite;
    }
    @keyframes floor { to { background-position: 0 34px, 0 0; } }
    button { font: inherit; color: inherit; cursor: pointer; }
    .cut { clip-path: polygon(var(--cut-s) 0, 100% 0, 100% calc(100% - var(--cut-s)), calc(100% - var(--cut-s)) 100%, 0 100%, 0 var(--cut-s)); }

    /* her, up top: her face in a neon frame, her name, her line on her plate */
    .her { display: flex; align-items: center; gap: 12px; min-height: 80px; }
    .her__frame { position: relative; flex: 0 0 auto; width: 72px; height: 72px; padding: 3px; background: linear-gradient(135deg, var(--g-green), var(--g-cyan) 60%, var(--g-red));
      clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); box-sizing: border-box; }
    .her__frame::after { content: ''; position: absolute; inset: 3px; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
      clip-path: inherit; }
    .her img { display: block; width: 100%; height: 100%; object-fit: cover; background: #0b0a10; filter: brightness(1.3) saturate(1.2);
      clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
    .her img.is-new { animation: glitch 240ms steps(3, end) 1; }
    @keyframes glitch { 0% { transform: translateX(-5px); clip-path: inset(0 0 55% 0); filter: hue-rotate(90deg); } 50% { transform: translateX(4px); clip-path: inset(40% 0 0 0); } 100% { transform: none; } }
    .her div.her__talk { flex: 1; min-width: 0; }
    .her h1 { margin: 0 0 5px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-family: var(--font-mono); letter-spacing: 0.2em; color: var(--yellow); text-transform: uppercase;
      text-shadow: 2px 0 0 rgba(255, 32, 82, 0.7), -2px 0 0 rgba(0, 240, 255, 0.5); }
    .her h1 .live { margin-left: auto; font-size: 9px; letter-spacing: 0.16em; color: var(--g-green); text-shadow: none; }
    .her h1 .live::before { content: '● '; animation: blink 1.2s steps(2, end) infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }
    .her p { margin: 0; font: 16px/1.35 var(--font-body, sans-serif); min-height: 2.7em; padding: 8px 10px; background: var(--g-panel);
      border-left: 3px solid var(--g-green); box-shadow: 4px 4px 0 rgba(0, 240, 255, 0.35); position: relative; }
    .her p::after { content: '▌'; color: var(--g-green); animation: blink 0.8s steps(2, end) infinite; margin-left: 2px; }

    .tag { margin: 18px 0 8px; font: 600 11px/1 var(--font-mono); letter-spacing: 0.2em; color: var(--g-cyan); text-transform: uppercase; opacity: 0.85; }
    .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .game { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; text-align: left; border: 0;
      background: linear-gradient(160deg, rgba(255, 32, 82, 0.12), transparent 45%), var(--g-panel);
      clip-path: polygon(var(--cut-s) 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 var(--cut-s));
      box-shadow: inset 0 0 0 1px rgba(0, 240, 255, 0.35); }
    .game::after { content: ''; position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; background: var(--g-red); clip-path: polygon(100% 0, 100% 100%, 0 100%); }
    .game:active { transform: translate(2px, 2px); filter: brightness(1.3); }
    .game__icon { font-size: 30px; line-height: 1; color: var(--yellow); text-shadow: 0 0 10px rgba(252, 238, 8, 0.6); }
    .game__name { font-size: 17px; letter-spacing: 0.03em; text-transform: uppercase; }
    .game__how { font: 12px/1.3 var(--font-body, sans-serif); color: var(--paper-2, #cfcec5); }
    .game__rec { margin-top: 2px; font: 600 10px/1 var(--font-mono); letter-spacing: 0.12em; color: var(--g-green); text-transform: uppercase; }
    /* where she's looking before she decides (brain.js hesitation), and her whispered hint */
    .ttt__cell.is-eye { background: var(--g-panel) url(../capri/assets/capri/capri-face.png) center / 40% no-repeat; opacity: 0.55; animation: eye 520ms ease-in-out; }
    .chess__sq.is-eye { box-shadow: inset 0 0 0 3px rgba(54, 255, 122, 0.75); animation: eye 520ms ease-in-out; }
    .mines__cell.is-hint { box-shadow: inset 0 0 0 2px var(--g-green), 0 0 12px var(--g-green); animation: eye 800ms ease-in-out 3; }
    @keyframes eye { 50% { filter: brightness(1.6); } }
    .levels { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
    .levels .tag { width: 100%; margin-bottom: 0; }
    .pill { padding: 10px 14px; border: 0; background: rgba(0, 240, 255, 0.08); box-shadow: inset 0 0 0 1px rgba(0, 240, 255, 0.5); font: 600 12px/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
    .pill.is-on { background: var(--yellow); color: var(--ink); box-shadow: 0 0 14px rgba(252, 238, 8, 0.5); }
    .pill--big { flex: 1; padding: 15px; font-size: 14px; }
    .pill:disabled { opacity: 0.35; }
    .bar { display: flex; justify-content: space-between; margin: 10px 0 12px; }
    .box { display: flex; flex-direction: column; align-items: stretch; }

    /* tic-tac-toe: you in yellow, her as her own mask */
    .ttt { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6px; width: min(100%, 360px); margin: 10px auto; aspect-ratio: 1; }
    .ttt__cell { background: var(--g-panel); border: 0; box-shadow: inset 0 0 0 1px rgba(0, 240, 255, 0.3); font-size: 56px; line-height: 1; padding: 0; display: grid; place-items: center;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
    .ttt__cell.is-x { color: var(--yellow); text-shadow: 0 0 12px rgba(252, 238, 8, 0.7); }
    .ttt__cell.is-o { color: transparent; background: var(--g-panel) url(../capri/assets/capri/capri-face.png) center / 72% no-repeat; box-shadow: inset 0 0 0 2px var(--g-green), inset 0 0 22px rgba(54, 255, 122, 0.35); animation: pop 260ms ease-out; }
    @keyframes pop { from { transform: scale(0.6); filter: hue-rotate(120deg) brightness(2); } }

    /* minesweeper */
    .mines__info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font: 600 14px var(--font-mono); letter-spacing: 0.08em; color: var(--g-cyan); }
    .mines__info span:last-child { color: var(--g-green); }
    .mines { display: grid; gap: 3px; width: min(100%, 420px); margin: 0 auto; }
    .mines__cell { aspect-ratio: 1; padding: 0; border: 0; background: rgba(0, 240, 255, 0.1); box-shadow: inset 0 0 0 1px rgba(0, 240, 255, 0.28); font: 700 16px var(--font-mono); }
    .mines__cell.is-open { background: rgba(17, 16, 22, 0.95); box-shadow: inset 0 0 0 1px rgba(242, 241, 232, 0.06); }
    .mines__cell.is-flag { color: var(--g-red); text-shadow: 0 0 8px var(--g-red); }
    .mines__cell.is-boom { background: var(--g-red); color: var(--ink); box-shadow: 0 0 16px var(--g-red); }
    .mines__cell[data-n="1"] { color: var(--g-cyan); } .mines__cell[data-n="2"] { color: var(--g-green); } .mines__cell[data-n="3"] { color: var(--yellow); }
    .mines__cell[data-n="4"] { color: #ff9a2e; } .mines__cell[data-n="5"], .mines__cell[data-n="6"], .mines__cell[data-n="7"], .mines__cell[data-n="8"] { color: var(--g-red); }
    .mines__cell[data-n] { text-shadow: 0 0 6px currentColor; }

    /* 21: chrome cards; hers face down carry her mask */
    .cards__row { display: flex; flex-wrap: wrap; gap: 8px; min-height: 104px; }
    .card { width: 66px; height: 96px; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 8px; box-sizing: border-box;
      background: linear-gradient(160deg, #f6f5ec, #c9c8bf); color: var(--ink); animation: deal 260ms ease-out;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); box-shadow: inset 0 0 0 2px var(--g-cyan); }
    .card b { font: 700 18px var(--font-mono); } .card i { align-self: flex-end; font-style: normal; font-size: 30px; line-height: 1; }
    .card.is-red { color: #e0103f; }
    .card.is-back { background: url(../capri/assets/capri/capri-face.png) center / 70% no-repeat, repeating-linear-gradient(45deg, #ff2052 0 6px, #13120d 6px 12px); box-shadow: inset 0 0 0 2px var(--g-green); }
    @keyframes deal { from { transform: translateY(-14px) rotate(-6deg); opacity: 0; filter: hue-rotate(90deg); } }
    .cards__acts { display: flex; gap: 10px; margin-top: 22px; }

    /* chess: a neon board; her pieces burn red */
    .chess { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: min(100%, 460px); aspect-ratio: 1; margin: 6px auto 0;
      box-shadow: 0 0 0 2px var(--g-cyan), 0 0 24px rgba(0, 240, 255, 0.35); }
    .chess__sq { padding: 0; border: 0; background: #2b2a38; font-size: min(9vw, 40px); line-height: 1; position: relative; }
    .chess__sq.is-dark { background: #14131c; box-shadow: inset 0 0 0 1px rgba(255, 32, 82, 0.12); }
    .chess__sq.is-w { color: #fffef4; text-shadow: 0 0 1px #000, 0 0 6px rgba(252, 238, 8, 0.8); }
    .chess__sq.is-b { color: var(--g-red); text-shadow: 0 0 1px #000, 0 0 8px rgba(255, 32, 82, 0.8); }
    .chess__sq.is-last { box-shadow: inset 0 0 0 3px rgba(0, 240, 255, 0.7); }
    .chess__sq.is-chosen { box-shadow: inset 0 0 0 3px var(--yellow); }
    .chess__sq.is-target::after { content: ''; position: absolute; inset: 36%; background: var(--g-green); box-shadow: 0 0 10px var(--g-green); transform: rotate(45deg); }
    .chess__sq.is-check { background: var(--g-red) !important; }
    .chess__caps { text-align: center; font-size: 18px; letter-spacing: 0.05em; min-height: 20px; }

    /* ping pong and rock, paper, scissors */
    .pong { display: block; margin: 0 auto; touch-action: none; box-shadow: 0 0 0 2px var(--g-cyan), 0 0 22px rgba(0, 240, 255, 0.3); }
    .rps__show { display: flex; align-items: center; justify-content: space-around; margin: 18px 0 22px; min-height: 110px; }
    .rps__hand { font-size: 76px; line-height: 1; min-width: 90px; text-align: center; filter: drop-shadow(0 0 10px rgba(252, 238, 8, 0.6)); }
    .rps__hand.is-her { filter: drop-shadow(0 0 12px rgba(54, 255, 122, 0.8)) hue-rotate(60deg); }
    .rps__hand.is-pop { animation: pop 260ms ease-out; }
    .rps__vs { font: 700 18px var(--font-mono); letter-spacing: 0.2em; color: var(--g-red); text-shadow: 0 0 10px var(--g-red); }
    .rps__acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .rps__pick { align-items: center; text-align: center; }
    .rps__pick.is-chosen { box-shadow: inset 0 0 0 2px var(--yellow), 0 0 14px rgba(252, 238, 8, 0.4); }
    .rps__pick:disabled { opacity: 0.4; }

    /* her, watching from the corner (games.js: pose by how it's going) */
    .her-body { position: fixed; right: 4px; bottom: 0; height: 150px; max-width: 46vw; object-fit: contain; object-position: right bottom; pointer-events: none; z-index: 5;
      filter: drop-shadow(0 0 8px rgba(255, 32, 82, 0.45)); transition: opacity 200ms; }
    .her-body.is-wide { height: 96px; max-width: 60vw; }
    .her-body.is-new { animation: glitch 300ms steps(3, end) 1; }
    /* the end of a game: a stamp across the screen */
    .stamp { position: fixed; left: 0; right: 0; top: 40%; z-index: 9; pointer-events: none; text-align: center; padding: 14px 0; font: 700 30px/1 var(--font-display); letter-spacing: 0.18em; text-transform: uppercase;
      background: rgba(7, 6, 10, 0.86); box-shadow: 0 2px 0 var(--g-cyan), 0 -2px 0 var(--g-red); animation: stamp 2.4s ease-out forwards; }
    .stamp.is-her { color: var(--g-green); text-shadow: 3px 0 var(--g-red), -3px 0 var(--g-cyan); }
    .stamp.is-you { color: var(--yellow); text-shadow: 3px 0 var(--g-red), -3px 0 var(--g-cyan); }
    .stamp.is-draw { color: var(--paper); text-shadow: 3px 0 var(--g-red), -3px 0 var(--g-cyan); }
    @keyframes stamp { 0% { transform: scaleY(0); } 8% { transform: scaleY(1.2) skewX(-12deg); } 14% { transform: none; } 18% { transform: translateX(-6px); clip-path: inset(0 0 50% 0); } 22% { transform: none; clip-path: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .card, .her img.is-new, .rps__hand.is-pop, .ttt__cell.is-o, .her-body.is-new, body::before { animation: none; } .stamp { animation: none; opacity: 0; } }
  </style>
</head>
<body>
  <section class="her"><div class="her__frame"><img id="face" src="../capri/assets/capri/capri-face.png" alt=""></div><div class="her__talk"><h1><span id="title">Juegos</span><span class="live">CAPRI</span></h1><p id="line"></p></div></section>
  <img id="body" class="her-body" src="../capri/assets/capri/poses/pose-wave.png" alt="">
  <main id="stage"></main>
  <script type="module" src="games.js"></script>
</body>
</html>
