name: Frases de voz 9.0.1

# Parche 1.12.1: parte de capri-voz-9.0.0, pone un respiro al inicio de cada frase y regraba (Fish Audio, comprobadas
# con Whisper) las que se oían cortadas. Publica la pre-release NUEVA capri-voz-9.0.1 (la 9.0.0 no se toca, así las
# versiones que ya apuntan a ella siguen comprobando sus mismos bytes).

on:
  push:
    branches: [claude/project-thread-yxlite]
    paths: [tools/voz/**, .github/workflows/voz-9-0-1.yml]

permissions:
  contents: write

concurrency:
  group: voz-9-0-1
  cancel-in-progress: false

jobs:
  frases:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: pip install -q faster-whisper
      - name: Bajar 9.0.0
        run: |
          mkdir -p src && cd src
          for f in capri-clips-es-MX.zip capri-clips-en-US.zip capri-voice-profiles.zip capri-voice-pc-runtime.zip SHA256SUMS; do
            curl -sSfL -o "$f" "https://github.com/${{ github.repository }}/releases/download/capri-voz-9.0.0/$f"
          done
          sha256sum -c SHA256SUMS
      - name: Frases 9.0.1
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: python3 tools/voz/frases_9_0_1.py src out
      - uses: actions/upload-artifact@v4
        with:
          name: frases-9.0.1
          path: out
      - name: Publicar capri-voz-9.0.1
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: capri-voz-9.0.1
        run: |
          cp src/capri-voice-profiles.zip src/capri-voice-pc-runtime.zip out/
          cd out
          sha256sum capri-clips-es-MX.zip capri-clips-en-US.zip capri-voice-profiles.zip capri-voice-pc-runtime.zip > SHA256SUMS
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat packs.json informe.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf 'Datos opcionales de la voz de Capri (frases 9.0.1). No es una versión de la app: Capri los baja sola desde Ajustes › Ajustes de voz.\n\nCada archivo se comprueba por SHA-256 (`SHA256SUMS`). Voz sin fines comerciales; úsala solo dentro de Capri.\n' > NOTAS.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.zip SHA256SUMS packs.json --clobber
          else
            gh release create "$TAG" *.zip SHA256SUMS packs.json --prerelease --target "${{ github.sha }}" \
              --title "Datos de voz de Capri 9.0.1" --notes-file NOTAS.md
          fi
