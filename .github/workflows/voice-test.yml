name: Su voz en el teléfono (emulador)

# (1.11.3) Lo que hace quien usa la app: «Bajar su voz» desde el canal público real (sus frases y su perfil),
# su perfil leído de vuelta y una frase suya sonando de principio a fin, en Android 10 (como quien reportó
# el fallo), 12 y 14.
on:
  workflow_dispatch:
  push:
    branches: [next]
    paths:
      - 'app/src/main/java/io/github/emmanuelquintana/capri/CapriVoice.kt'
      - 'app/src/main/java/io/github/emmanuelquintana/capri/CapriNeural.kt'
      - 'app/src/main/java/io/github/emmanuelquintana/capri/VoiceSelfTest.kt'
      - 'app/src/main/java/io/github/emmanuelquintana/voice/**'
      - 'app/src/main/jniLibs/**'
      - 'app/build.gradle.kts'
      - 'tools/ci/voice-test.sh'
      - 'tools/ci/voice-flows.sh'
      - '.github/workflows/voice-test.yml'

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # (1.11.8) también un emulador de 32 bits (x86): como los teléfonos armeabi-v7a (TECNO Spark Go 1S,
      # Android Go), donde 1.11.0–1.11.7 no se instalaban («CPU incompatible»)
      matrix:
        include:
          - { api: 29, arch: x86_64 }
          - { api: 31, arch: x86_64 }
          - { api: 34, arch: x86_64 }
          - { api: 30, arch: x86 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.arch }}
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: adb shell cmd package list packages | grep -iE 'tts|pico' ; bash tools/ci/voice-test.sh && bash tools/ci/voice-flows.sh
