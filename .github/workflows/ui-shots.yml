name: Capturas de la app

# En cada push a una rama que no es main (y a mano): compila la versión de depuración, la abre en un emulador, recorre la bienvenida y las
# pestañas, y deja capturas en el registro (base64) y como artefacto.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      api:
        description: 'Android del emulador (33 trae un WebView viejo, sin oklch)'
        default: '34'
      gpu:
        description: 'GPU del emulador (swangle_indirect, swiftshader_indirect, host…)'
        default: 'swangle_indirect'

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleGithubDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || 34 }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          ram-size: 4096M
          heap-size: 576M
          # (swiftshader_indirect made the emulator itself crash a few seconds after her overlay came up, 2026-11-10)
          emulator-options: -no-window -gpu ${{ inputs.gpu || 'swangle_indirect' }} -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/ui-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: shots/
      - name: Si el emulador se cayó, su reporte
        if: always()
        run: ls -la /tmp/android-runner/ 2>/dev/null; find /tmp/android-runner -maxdepth 2 -type f 2>/dev/null | head -20; tail -50 /tmp/android-runner/*.log 2>/dev/null || true
