name: Capturas de la app

# En cada push a una rama que no es main (y a mano): compila la versión de depuración, la abre en un emulador, recorre la bienvenida y las
# pestañas, y deja capturas en el registro (base64) y como artefacto.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      api:
        description: 'Android del emulador (33 trae un WebView viejo, sin oklch)'
        default: '34'

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || 34 }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/ui-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: shots/
